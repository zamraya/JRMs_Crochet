<script>
 function toggleMenu() {
  document.querySelector(".nav-links").classList.toggle("active");
}

// Wishlist container
const wishlistContent = document.getElementById("wishlist-content");

// Render wishlist items with filter & sort
function renderWishlist() {
  let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];

  // --- FILTER BY CATEGORY ---
  const categoryFilterEl = document.getElementById("filter-category");
  if (categoryFilterEl) {
    const categoryFilter = categoryFilterEl.value;
    if (categoryFilter && categoryFilter !== "All") {
      wishlist = wishlist.filter(item => item.category === categoryFilter);
    }
  }

  // --- SORT BY RECENTLY ADDED ---
  const sortOrderEl = document.getElementById("sort-order");
  if (sortOrderEl) {
    const sortOrder = sortOrderEl.value;
    if (sortOrder === "recent") {
      wishlist = wishlist.slice().reverse(); // newest first
    } else if (sortOrder === "oldest") {
      wishlist = wishlist.slice(); // original order
    }
  }

  wishlistContent.innerHTML = "";

  if (wishlist.length === 0) {
    wishlistContent.innerHTML = `
      <div class="empty-state">
        <div class="heart-circle">
          <i class="far fa-heart"></i>
        </div>
        <h4>List is empty</h4>
        <p>You can add items to wish list by clicking <span class="red-heart">❤</span></p>
        <a href="products.html" class="browse-link">Browse products</a>
      </div>
    `;
    updateWishlistCount();
    return;
  }

  wishlist.forEach(item => {
    wishlistContent.innerHTML += `
      <div class="wishlist-item" data-id="${item.id}">
        <img src="${item.image}" alt="${item.name}">
        <div class="wishlist-info">
          <strong>${item.name}</strong>
          <span>${item.price}</span>
        </div>
        <div class="wishlist-actions">
          <button class="move-cart-btn">Add to Cart</button>
          <i class="fas fa-heart remove-btn"></i>
        </div>
      </div>
    `;
  });

  attachRemoveEvents();
  attachMoveToCartEvents();
  updateWishlistCount();
}

document.getElementById("filter-category").addEventListener("change", renderWishlist);
document.getElementById("sort-order").addEventListener("change", renderWishlist);

// Remove from wishlist
function attachRemoveEvents() {
  document.querySelectorAll(".remove-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.closest(".wishlist-item").dataset.id;
      let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
      wishlist = wishlist.filter(item => item.id !== id);
      localStorage.setItem("wishlist", JSON.stringify(wishlist));
      renderWishlist();
    });
  });
}

// Move wishlist item to cart with correct image
function attachMoveToCartEvents() {
  document.querySelectorAll(".move-cart-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const itemEl = btn.closest(".wishlist-item");
      const id = itemEl.dataset.id;

      let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
      let cart = JSON.parse(localStorage.getItem("cart")) || [];

      const product = wishlist.find(p => p.id === id);
      if (product) {
        // Ensure the image path is correct
        let imagePath = product.image;
        if (!imagePath.includes("/")) {
          // If the image path is just a file name, prepend the folder
          imagePath = "amigurumis/" + product.image; 
          imagePath = "bouquets/" + product.image; 
          imagePath = "keychains/" + product.image; 
          imagePath = "moneybouquets/" + product.image; 
          imagePath = "pottedplants/" + product.image; 
          imagePath = "pouches/" + product.image; 
          imagePath = "satin/" + product.image; 
          imagePath = "others/" + product.image; 
        }

        const existing = cart.find(p => p.id === product.id);
        if (existing) existing.quantity++;
        else cart.push({
          ...product,
          image: imagePath, // force correct path
          quantity: 1,
          price: parseFloat(product.price.replace(/₱|,/g, ''))
        });

        localStorage.setItem("cart", JSON.stringify(cart));
        updateCartCount();

        // Remove from wishlist
        wishlist = wishlist.filter(p => p.id !== id);
        localStorage.setItem("wishlist", JSON.stringify(wishlist));
        renderWishlist();

        alert(`${product.name} added to cart!`);
      }
    });
  });
}

// Update wishlist badge
function updateWishlistCount() {
  const wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
  document.getElementById("wishlist-count").textContent = wishlist.length;
}

// Update cart badge
function updateCartCount() {
  const cart = JSON.parse(localStorage.getItem("cart")) || [];
  document.getElementById("cart-count").textContent = cart.length;
}

// Initial render
renderWishlist();
updateCartCount();

  const tbody = document.getElementById("cart-items");
    const totalSpan = document.querySelector(".cart-total span");
    const itemCount = document.querySelector(".item-count");
    const cartCount = document.getElementById("cart-count");

    // Load cart from localStorage
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    // Remove null/invalid items
    cart = cart.filter(item => item && item.id && item.name && !isNaN(item.price) && item.quantity > 0);
    localStorage.setItem("cart", JSON.stringify(cart));


    // Render cart function
    function renderCart() {
      tbody.innerHTML = "";
      let total = 0;

      cart.forEach(item => {
        const itemTotal = item.price * item.quantity;
        total += itemTotal;

        const row = document.createElement("tr");
        row.innerHTML = `
          <td>
            <div class="product-details">
              <img src="${item.img}" alt="${item.name}">
              <div class="product-info">
                <h4>${item.name}</h4>
                <p>${item.category || "Uncategorized"}</p>
                <span class="remove" data-id="${item.id}">Remove</span>
              </div>
            </div>
          </td>
          <td>
                <div class="quantity-wrapper">
                <div class="quantity-control">
                <button class="decrease" data-id="${item.id}">-</button>
                <span>${item.quantity}</span>
                <button class="increase" data-id="${item.id}">+</button>
            </div>
            </div>
            </td>
          <td>₱${item.price}</td>
          <td>₱${itemTotal}</td>
        `;
        tbody.appendChild(row);
      });

      totalSpan.textContent = `₱${total}`;
      itemCount.textContent = `${cart.length} Item(s)`;
      cartCount.textContent = cart.length;
    }

    renderCart(); // initial render

    // Handle cart actions
    tbody.addEventListener("click", (e) => {
      const id = e.target.dataset.id;
      if (!id) return;

      const index = cart.findIndex(item => item.id === id);
      if (index === -1) return;

      if (e.target.classList.contains("remove")) {
        cart.splice(index, 1);
      } else if (e.target.classList.contains("increase")) {
        cart[index].quantity++;
      } else if (e.target.classList.contains("decrease")) {
        if (cart[index].quantity > 1) cart[index].quantity--;
      }

      localStorage.setItem("cart", JSON.stringify(cart));
      renderCart();
    });


  // Update Wishlist Count
  function updateWishlistCount() {
    const wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
    document.getElementById("wishlist-count").textContent = wishlist.length;
  }
  updateWishlistCount();

  /* ❤️ WISHLIST LOGIC */
  likeButtons.forEach(btn => {
    const card = btn.closest(".product-card");

    const product = {
      id: card.dataset.id,
      name: card.dataset.name,
      price: "₱" + card.dataset.price,
      image: card.dataset.img,
      category: categoryName
    };

    // Set initial heart state
    let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
    if (wishlist.some(item => item.id === product.id)) {
      btn.classList.add("active");
    }

    btn.addEventListener("click", () => {
      let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
      const exists = wishlist.find(item => item.id === product.id);

      if (exists) {
        // Remove from wishlist
        wishlist = wishlist.filter(item => item.id !== product.id);
        btn.classList.remove("active");
      } else {
        // Add to wishlist
        wishlist.push(product);
        btn.classList.add("active");
      }

      localStorage.setItem("wishlist", JSON.stringify(wishlist));
      updateWishlistCount(); // Update count after every click
    });
  });
</script>
